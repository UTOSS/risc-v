name: risc-v CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '23 6 * * *' # Run nightly at 01:23 EST (06:23 UTC)


permissions:
  contents: read
  packages: write

# runs on the same ref push to the same CI image tag (e.g. `ci-branch-main`), so overlapping runs can
# overwrite each other's image between build and test; serialize them per ref and queue (rather than
# drop) pending runs so every merge to main still gets tested
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  build_ci_image:
    # do this during a push to a branch (e.g. to main) or on a non-fork PR
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ghcr.io/utoss/risc-v
      dockerfile: ./Dockerfile.ci
      tag-prefix: ci-
    secrets: inherit

  # we have both internal and external collaborators, and we need to differentiate which CI image
  # thier pipelines use; this is because internaly, every PR builds and caches (via docker push) a
  # new CI image; this helps reduce friction when adding new dependencies to the CI image but
  # requires write access to the GHCR repo for the org, which only org members have; to address
  # this, this job selects `ci-branch-main` image for external collaborators so that they don't need
  # to write anythign to GHCR; there is a chance that PR might diverge from the `ci-branch-main` tag
  # and might cause issues for the contributor, but we'll see if that ever happens first
  select_ci_image:
    runs-on: ubuntu-latest
    needs: build_ci_image
    if: always() # dont skip if build_ci_image is skipped
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
    steps:
      - id: image
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]; then
            echo "tag=${{ needs.build_ci_image.outputs.image-primary-tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=ghcr.io/utoss/risc-v:ci-branch-main" >> $GITHUB_OUTPUT
          fi

  build_devcontainer_image:
    # do this during a push to a branch (e.g. to main) or on a non-fork PR
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ghcr.io/utoss/risc-v-devcontainer
      dockerfile: .devcontainer/Dockerfile
      tag-prefix: ""
    secrets: inherit

  svlint:
    needs: select_ci_image
    if: always() # dont skip if build_ci_image is skipped
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.select_ci_image.outputs.image-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: lint sources
        run: make svlint

      - name: lint testbench
        run: make svlint_tb

      - name: check timescale
        run: make check_timescale

      - name: lint DE1-SoC environment files
        run: make svlint ENV=de1-soc

      - name: lint ECP5 environment files
        run: make svlint ENV=ecp5

      - name: lint Hardening environment files
        run: make svlint ENV=hardening

  test_diagrams:
    needs: select_ci_image
    if: always() # dont skip if build_ci_image is skipped
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.select_ci_image.outputs.image-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # re-exports the block diagrams from docs/diagrams/mas.drawio and re-renders the timing
      # diagrams from docs/diagrams/timing/*.json, then checks both against the checked-in SVGs
      - name: Test diagrams
        id: test-diagrams
        run: make test_diagrams

      # the SVGs CI generated, so they can be downloaded and committed if a local export differs
      - name: Upload diagrams
        uses: actions/upload-artifact@v4
        if: always() && steps.test-diagrams.outcome != 'skipped'
        with:
          name: diagrams
          path: |
            docs/diagrams/block/*.svg
            docs/diagrams/timing/*.svg
          retention-days: 7

  pyuvm:
    timeout-minutes: 10
    needs: select_ci_image
    if: always() && needs.select_ci_image.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.select_ci_image.outputs.image-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PyUVM verification
        run: make test_pyuvm

      - name: Upload PyUVM results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyuvm-results
          path: PyUVM/results-*.xml
          retention-days: 7

  build_and_test:
    timeout-minutes: 30
    needs: select_ci_image
    # dont skip if build_ci_image is skipped
    if: always()
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.select_ci_image.outputs.image-tag }}

    strategy:
      matrix: &utoss-risc-v-matrix
        config:
          - RV32I
          - RV32IZbb_Zbkb
          - RV32IZicsr

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build top
        id: build-top
        run: make build_top UTOSS_RISCV_CONFIG=${{ matrix.config }}

      - name: Build testbench
        id: build-testbench
        run: make build_tb UTOSS_RISCV_CONFIG=${{ matrix.config }}

      - name: Run testbench
        run: make run_tb

      - name: Upload VCD files
        uses: actions/upload-artifact@v4
        if: steps.build-testbench.outcome == 'success'
        with:
          name: vcd-files-${{ matrix.config }}
          path: test/vcd/*.vcd
          retention-days: 7

      - name: Upload VVP files
        uses: actions/upload-artifact@v4
        if: steps.build-top.outcome == 'success'
        with:
          name: vvp-files-${{ matrix.config }}
          path: out/*.vvp
          retention-days: 7

  riscof:
    timeout-minutes: 30
    needs: select_ci_image
    # dont skip if build_ci_image is skipped
    if: always()
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.select_ci_image.outputs.image-tag }}

    strategy:
      matrix: *utoss-risc-v-matrix

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build DUT
        run: make riscof_build_dut UTOSS_RISCV_CONFIG=${{ matrix.config }}

      - name: Validate YAML
        run: make riscof_validateyaml UTOSS_RISCV_CONFIG=${{ matrix.config }}

      - name: Clone arch-test
        run: make riscof_clone_archtest

      - name: Run RISCOF
        run: make riscof_run UTOSS_RISCV_CONFIG=${{ matrix.config }}

      - name: Upload RISCOF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riscof-report-${{ matrix.config }}
          path: |
            riscof/riscof_work/report.html
            riscof/riscof_work/style.css
          retention-days: 7

  riscv_dv:
    timeout-minutes: 30
    needs: select_ci_image
    # dont skip if build_ci_image is skipped
    if: always()
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.select_ci_image.outputs.image-tag }}

    strategy:
      matrix: *utoss-risc-v-matrix

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run riscv-dv
        env:
          RISCV_DV_DIR: /opt/riscv-dv
        run: make riscv_dv UTOSS_RISCV_CONFIG=${{ matrix.config }}

      - name: Upload riscv-dv logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riscv-dv-logs-${{ matrix.config }}
          path: utoss_riscv_dv/logs/**
          retention-days: 7

  mcy:
    timeout-minutes: 60
    needs: select_ci_image
    # dont skip if build_ci_image is skipped
    if: always()
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.select_ci_image.outputs.image-tag }}

    strategy:
      matrix: *utoss-risc-v-matrix

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run mcy
        env:
          RISCV_DV_DIR: /opt/riscv-dv
        run: make mcy UTOSS_RISCV_CONFIG=${{ matrix.config }}

      - name: Upload mcy logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcy-logs-${{ matrix.config }}
          path: |
            mcy/config.mcy
            mcy/database/**
            mcy/tasks/**/logfile.txt
          retention-days: 7

      - name: Publish MCY coverage
        if: always()
        run: |
          if [ -f mcy/database/db.sqlite3 ]; then
            {
              echo '### MCY mutation coverage (${{ matrix.config }})'
              echo ''
              echo '```text'
              (cd mcy && mcy status)
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'MCY (${{ matrix.config }}) failed before creating its database.' >> "$GITHUB_STEP_SUMMARY"
          fi

  de1-soc:
    timeout-minutes: 30
    needs:
      - select_ci_image
      - build_and_test
    # dont skip if build_ci_image is skipped; need explicit check for needs' success
    if: always() && needs.build_and_test.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.select_ci_image.outputs.image-tag }}

    strategy:
      matrix: *utoss-risc-v-matrix

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build PoC
        id: build-poc
        run: cd envs/de1-soc/poc && make

      - name: Build and run DE1-SoC testbench
        run: cd envs/de1-soc && make

      - name: Synthesize
        id: synthesize
        run: cd envs/de1-soc/quartus && make synthesize UTOSS_RISCV_CONFIG=${{ matrix.config }}

      - name: Gather metrics
        run: cd envs/de1-soc/quartus && make pretty-metrics

      - name: Draw placement figures
        id: images
        if: steps.synthesize.outcome == 'success'
        run: cd envs/de1-soc/quartus && make images UTOSS_RISCV_CONFIG=${{ matrix.config }}

      # the figures CI drew are committed to internal PRs by the image-update job below
      - name: Upload placement figures
        uses: actions/upload-artifact@v4
        if: always() && steps.images.outcome == 'success'
        with:
          name: de1-soc-images-${{ matrix.config }}
          path: envs/de1-soc/quartus/images/${{ matrix.config }}/*.png
          retention-days: 7

      - name: Upload VCD file
        uses: actions/upload-artifact@v4
        if: steps.build-poc.outcome == 'success'
        with:
          name: de1-soc-tb-vcd-${{ matrix.config }}
          path: envs/de1-soc/top_tb.vcd
          retention-days: 7

      - name: Upload SOF
        uses: actions/upload-artifact@v4
        if: steps.synthesize.outcome == 'success'
        with:
          name: de1-soc-sof-${{ matrix.config }}
          path: envs/de1-soc/quartus/output_files/utoss-risc-v.sof

      - name: Upload Quartus reports
        uses: actions/upload-artifact@v4
        if: steps.synthesize.outcome == 'success'
        with:
          name: de1-soc-quartus-reports-${{ matrix.config }}
          path: |
            envs/de1-soc/quartus/output_files/utoss-risc-v.sta.summary
            envs/de1-soc/quartus/output_files/utoss-risc-v.fit.summary
            envs/de1-soc/quartus/metrics/fitter_utilization.csv
            envs/de1-soc/quartus/metrics/fitter_utilization.pretty.txt
          retention-days: 7

  de1-soc-synthesis-metrics-diff:
    timeout-minutes: 10
    needs: de1-soc
    # dont run this on fork PRs; this will fail to permission issues when posting a comment; i don't
    # understand exactly the permission mechanism that prohibits this so will need to look into this
    # further down the road;
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    strategy:
      matrix: *utoss-risc-v-matrix

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download PR Quartus reports
        uses: actions/download-artifact@v4
        with:
          name: de1-soc-quartus-reports-${{ matrix.config }}
          path: pr-reports

      - name: Download base branch Quartus reports
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        id: download-base
        with:
          workflow: ci.yaml
          branch: ${{ github.base_ref }}
          name: de1-soc-quartus-reports-${{ matrix.config }}
          path: base-reports
          check_artifacts: true
          search_artifacts: true

      - name: Initialize metrics diff files
        run: |
          mkdir -p metric-diff

      - name: Compare Fitter Summary
        run: >
          .github/scripts/metrics-diff/compare_metrics_diff.sh
          "base-reports/output_files/utoss-risc-v.fit.summary"
          "pr-reports/output_files/utoss-risc-v.fit.summary"
          > metric-diff/fitter_summary.md

      - name: Compare Fitter Resource Utilization by Entity
        run: >
          .github/scripts/metrics-diff/compare_metrics_diff.sh
          "base-reports/metrics/fitter_utilization.pretty.txt"
          "pr-reports/metrics/fitter_utilization.pretty.txt"
          > metric-diff/fitter_by_entity.md

      - name: Compare Timing Analysis Summary
        run: >
          .github/scripts/metrics-diff/compare_metrics_diff.sh
          "base-reports/output_files/utoss-risc-v.sta.summary"
          "pr-reports/output_files/utoss-risc-v.sta.summary"
          > metric-diff/timing_summary.md

      - name: Upload per-config metrics diff
        uses: actions/upload-artifact@v4
        with:
          name: de1-soc-synthesis-metrics-diff-${{ matrix.config }}
          path: metric-diff/*.md
          retention-days: 7

  ecp5:
    timeout-minutes: 30
    needs:
      - select_ci_image
      - build_and_test
    if: always() && needs.build_and_test.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.select_ci_image.outputs.image-tag }}

    strategy:
      matrix: *utoss-risc-v-matrix

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build PoC
        id: build-poc
        run: cd envs/ecp5/poc && make

      - name: Build and run ECP5 testbench
        run: cd envs/ecp5 && make UTOSS_RISCV_CONFIG=${{ matrix.config }}

      - name: Synthesize and place & route
        id: synthesize
        run: cd envs/ecp5/trellis && make synthesize UTOSS_RISCV_CONFIG=${{ matrix.config }}

      - name: Gather metrics
        run: cd envs/ecp5/trellis && make pretty-metrics

      - name: Draw placement figures
        id: images
        if: steps.synthesize.outcome == 'success'
        run: cd envs/ecp5/trellis && make images UTOSS_RISCV_CONFIG=${{ matrix.config }}

      # the figures CI drew are committed to internal PRs by the image-update job below
      - name: Upload placement figures
        uses: actions/upload-artifact@v4
        if: always() && steps.images.outcome == 'success'
        with:
          name: ecp5-images-${{ matrix.config }}
          path: envs/ecp5/trellis/images/${{ matrix.config }}/*.png
          retention-days: 7

      - name: Upload VCD file
        uses: actions/upload-artifact@v4
        if: steps.build-poc.outcome == 'success'
        with:
          name: ecp5-tb-vcd-${{ matrix.config }}
          path: envs/ecp5/top_tb.vcd
          retention-days: 7

      - name: Upload bitstream
        uses: actions/upload-artifact@v4
        if: steps.synthesize.outcome == 'success'
        with:
          name: ecp5-bitstream-${{ matrix.config }}
          path: envs/ecp5/trellis/out/utoss-risc-v.bit

      - name: Upload ECP5 reports
        uses: actions/upload-artifact@v4
        if: steps.synthesize.outcome == 'success'
        with:
          name: ecp5-reports-${{ matrix.config }}
          path: |
            envs/ecp5/trellis/metrics/pnr_summary.txt
            envs/ecp5/trellis/metrics/pnr_utilization.csv
            envs/ecp5/trellis/metrics/pnr_utilization.pretty.txt
            envs/ecp5/trellis/metrics/timing_summary.txt
          retention-days: 7

  ecp5-synthesis-metrics-diff:
    timeout-minutes: 10
    needs: ecp5
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    strategy:
      matrix: *utoss-risc-v-matrix

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download PR ECP5 reports
        uses: actions/download-artifact@v4
        with:
          name: ecp5-reports-${{ matrix.config }}
          path: pr-reports

      - name: Download base branch ECP5 reports
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        id: download-base
        with:
          workflow: ci.yaml
          branch: ${{ github.base_ref }}
          name: ecp5-reports-${{ matrix.config }}
          path: base-reports
          check_artifacts: true
          search_artifacts: true

      - name: Initialize metrics diff files
        run: |
          mkdir -p metric-diff

      - name: Compare PnR Summary
        run: >
          .github/scripts/metrics-diff/compare_metrics_diff.sh
          "base-reports/pnr_summary.txt"
          "pr-reports/pnr_summary.txt"
          > metric-diff/pnr_summary.md

      - name: Compare Utilization by Entity
        run: >
          .github/scripts/metrics-diff/compare_metrics_diff.sh
          "base-reports/pnr_utilization.pretty.txt"
          "pr-reports/pnr_utilization.pretty.txt"
          > metric-diff/pnr_by_entity.md

      - name: Compare Timing Summary
        run: >
          .github/scripts/metrics-diff/compare_metrics_diff.sh
          "base-reports/timing_summary.txt"
          "pr-reports/timing_summary.txt"
          > metric-diff/timing_summary.md

      - name: Upload per-config metrics diff
        uses: actions/upload-artifact@v4
        with:
          name: ecp5-synthesis-metrics-diff-${{ matrix.config }}
          path: metric-diff/*.md
          retention-days: 7

  hardening:
    timeout-minutes: 30
    needs:
      - select_ci_image
      - build_and_test
    if: always() && needs.build_and_test.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.select_ci_image.outputs.image-tag }}

    strategy:
      matrix: *utoss-risc-v-matrix

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Harden (pre-PnR)
        id: harden_pre_pnr
        run: cd envs/hardening && make harden_pre_pnr UTOSS_RISCV_CONFIG=${{ matrix.config }}

      - name: Harden (place & route)
        id: harden
        run: cd envs/hardening && make harden UTOSS_RISCV_CONFIG=${{ matrix.config }}

      # the images CI rendered are committed to internal PRs by the image-update job below
      - name: Upload layout images
        uses: actions/upload-artifact@v4
        if: always() && steps.harden.outcome == 'success'
        with:
          name: hardening-images-${{ matrix.config }}
          path: envs/hardening/images/${{ matrix.config }}/*.png
          retention-days: 7

      # upload even if PnR failed so the pre-PnR reports and the PnR log are still available
      - name: Upload Hardening reports
        uses: actions/upload-artifact@v4
        if: always() && steps.harden_pre_pnr.outcome == 'success'
        with:
          name: hardening-reports-${{ matrix.config }}
          path: |
            envs/hardening/out/stats.json
            envs/hardening/metrics/synthesis_utilization.csv
            envs/hardening/metrics/synthesis_utilization.pretty.txt
            envs/hardening/metrics/gate_breakdown.txt
            envs/hardening/metrics/stat_summary.txt
            envs/hardening/metrics/pnr_utilization.csv
            envs/hardening/metrics/pnr_utilization.pretty.txt
            envs/hardening/metrics/pnr_gate_breakdown.txt
            envs/hardening/metrics/pnr_timing.txt
            envs/hardening/out/pnr/*.rpt
            envs/hardening/out/pnr/summary.json
            envs/hardening/out/pnr/pnr.log
          retention-days: 7

  update-generated-images:
    needs:
      - de1-soc
      - ecp5
      - hardening
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download DE1-SoC placement images
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: de1-soc-images-*
          path: image-artifacts/de1-soc

      - name: Download ECP5 placement images
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ecp5-images-*
          path: image-artifacts/ecp5

      - name: Download hardening images
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: hardening-images-*
          path: image-artifacts/hardening

      - name: Restore generated images
        shell: bash
        run: |
          set -e
          for artifact in image-artifacts/de1-soc/de1-soc-images-*; do
            [ -d "$artifact" ] || continue
            config="${artifact##*-}"
            mkdir -p "envs/de1-soc/quartus/images/$config"
            cp "$artifact"/*.png "envs/de1-soc/quartus/images/$config/"
          done
          for artifact in image-artifacts/ecp5/ecp5-images-*; do
            [ -d "$artifact" ] || continue
            config="${artifact##*-}"
            mkdir -p "envs/ecp5/trellis/images/$config"
            cp "$artifact"/*.png "envs/ecp5/trellis/images/$config/"
          done
          for artifact in image-artifacts/hardening/hardening-images-*; do
            [ -d "$artifact" ] || continue
            config="${artifact##*-}"
            mkdir -p "envs/hardening/images/$config"
            cp "$artifact"/*.png "envs/hardening/images/$config/"
          done

      - name: Commit generated images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- envs/de1-soc/quartus/images envs/ecp5/trellis/images envs/hardening/images
          if git diff --cached --quiet; then
            echo "Generated images are already up to date."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "update generated placement and hardening images"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  hardening-metrics-diff:
    timeout-minutes: 10
    needs: hardening
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    strategy:
      matrix: *utoss-risc-v-matrix

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download PR Hardening reports
        uses: actions/download-artifact@v4
        with:
          name: hardening-reports-${{ matrix.config }}
          path: pr-reports

      - name: Download base branch Hardening reports
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        id: download-base
        with:
          workflow: ci.yaml
          branch: ${{ github.base_ref }}
          name: hardening-reports-${{ matrix.config }}
          path: base-reports
          check_artifacts: true
          search_artifacts: true

      - name: Initialize metrics diff files
        run: |
          mkdir -p metric-diff

      - name: Compare Hardening Utilization by Entity
        run: >
          .github/scripts/metrics-diff/compare_metrics_diff.sh
          "base-reports/metrics/synthesis_utilization.pretty.txt"
          "pr-reports/metrics/synthesis_utilization.pretty.txt"
          > metric-diff/hardening_utilization.md

      - name: Compare Hardening Gate Breakdown
        run: >
          .github/scripts/metrics-diff/compare_metrics_diff.sh
          "base-reports/metrics/gate_breakdown.txt"
          "pr-reports/metrics/gate_breakdown.txt"
          > metric-diff/hardening_gate_breakdown.md

      - name: Compare Post-PnR Utilization by Hierarchy
        run: >
          .github/scripts/metrics-diff/compare_metrics_diff.sh
          "base-reports/metrics/pnr_utilization.pretty.txt"
          "pr-reports/metrics/pnr_utilization.pretty.txt"
          > metric-diff/pnr_utilization.md

      - name: Compare Post-PnR Gate Breakdown
        run: >
          .github/scripts/metrics-diff/compare_metrics_diff.sh
          "base-reports/metrics/pnr_gate_breakdown.txt"
          "pr-reports/metrics/pnr_gate_breakdown.txt"
          > metric-diff/pnr_gate_breakdown.md

      - name: Compare Post-PnR Timing
        run: >
          .github/scripts/metrics-diff/compare_metrics_diff.sh
          "base-reports/metrics/pnr_timing.txt"
          "pr-reports/metrics/pnr_timing.txt"
          > metric-diff/pnr_timing.md

      - name: Upload per-config metrics diff
        uses: actions/upload-artifact@v4
        with:
          name: hardening-metrics-diff-${{ matrix.config }}
          path: metric-diff/*.md
          retention-days: 7

  metrics-diff-aggregate:
    timeout-minutes: 10
    needs:
      - de1-soc-synthesis-metrics-diff
      - ecp5-synthesis-metrics-diff
      - hardening-metrics-diff
    if: >
      always() &&
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event_name == 'pull_request' &&
      (needs.de1-soc-synthesis-metrics-diff.result == 'success' || needs.ecp5-synthesis-metrics-diff.result == 'success' || needs.hardening-metrics-diff.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download per-config DE1-SoC metrics diff artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: de1-soc-synthesis-metrics-diff-*
          path: metrics-diff

      - name: Download per-config ECP5 metrics diff artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ecp5-synthesis-metrics-diff-*
          path: metrics-diff

      - name: Download per-config Hardening metrics diff artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: hardening-metrics-diff-*
          path: metrics-diff

      - name: Build combined comparison report
        run: bash .github/scripts/metrics-diff/aggregate_metrics.sh metrics-diff comparison.md

      - name: Publish comparison to job summary
        run: cat comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/metrics-diff/post_comment.js');
            await script({github, context, comparisonFile: 'comparison.md'});
